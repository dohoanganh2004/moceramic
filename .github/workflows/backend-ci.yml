name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "MoCeramicShop/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "MoCeramicShop/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: MoCeramicShop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
          MYSQL_DATABASE: moceramic_shop_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p${{ secrets.DB_TEST_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://localhost:3306/moceramic_shop_db
      DB_USERNAME: root
      DB_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
      JWT_SECRET: ci-test-secret-not-used-in-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t moceramic-backend:ci .
