spring.application.name=MoCeramicShop

spring.docker.compose.enabled=false

spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moceramic_shop_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh=${JWT_REFRESH:604800000}

app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.public-path=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
