spring.application.name=MoCeramicShop

spring.docker.compose.enabled=false

spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moceramic_shop_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh=${JWT_REFRESH:604800000}

app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.public-path=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# SMTP (used by EmailServiceImp for the forgot-password email). MAIL_USERNAME
# and MAIL_PASSWORD live in secrets.properties, which is gitignored.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_USERNAME:no-reply@moceramic.local}
app.mail.from-name=MoCeramic

# Used to build links (e.g. the reset-password link) that point back at the
# storefront rather than at this API.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Redis: token blacklist (TTL-based), rate limiting counters, response cache,
# and the distributed lock used to serialize inventory reservation.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
